name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить версию в теге
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts || {
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName в app/build.gradle.kts"
            exit 1
          }

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      - name: Собрать release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && exit 0
            echo "::warning::Сборка не удалась (попытка $attempt), повтор"
            sleep 15
          done
          exit 1

      - name: Подготовить файл релиза
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "OrderControl-$VERSION.apk"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: OrderControl-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
